name: Upscale overlays

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow numpy

      - name: Enhance SAR overlay (hole filling, despeckle, 2x bicubic)
        run: python scripts/upscale_overlays.py

      - name: Commit texture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/textures/sar_hi.webp
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Upscale SAR overlay (sar_hi.webp)"
          git push
